name: HostSec quality gates
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned validation tools
        run: |
          python -m pip install -r scripts/requirements.txt
          make tools
      - name: Verify modules and execute gates
        env:
          HOSTSEC_EVIDENCE_DIR: docs/05-testing/evidence/ci
        run: |
          go -C backend mod verify
          make check
      - name: Upload evidence and build manifests
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hostsec-offline-cli-evidence
          path: |
            docs/05-testing/evidence/ci
            build/hostsec-linux-*
            build/build-manifest.json
            build/sbom.cdx.json
